version: '3.8'

services:
  eliza-multi-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eliza-multi-agent
    ports:
      - "${SCHWEPE_PORT:-3000}:3000"      # Schwepe (Hyperfy)
      - "${SCHIZ0TR0N_PORT:-3001}:3001"   # Schiz0tr0n (Telegram)
    environment:
      # Multi-Agent Control
      - RUN_SCHWEPE=${RUN_SCHWEPE:-true}
      - RUN_SCHIZ0TR0N=${RUN_SCHIZ0TR0N:-false}
      
      # ===== SCHWEPE AGENT (Hyperfy) =====
      # AI Provider for Schwepe (at least one required)
      - SCHWEPE_OPENAI_API_KEY=${SCHWEPE_OPENAI_API_KEY}
      - SCHWEPE_ANTHROPIC_API_KEY=${SCHWEPE_ANTHROPIC_API_KEY}
      - SCHWEPE_GROQ_API_KEY=${SCHWEPE_GROQ_API_KEY}
      - SCHWEPE_OPENROUTER_API_KEY=${SCHWEPE_OPENROUTER_API_KEY}
      
      # Hyperfy WebSocket URL
      - WS_URL=${WS_URL:-ws://localhost:3011/ws}
      
      # ===== SCHIZ0TR0N AGENT (Telegram) =====
      # Telegram Bot Token
      - SCHIZ0TR0N_TELEGRAM_BOT_TOKEN=${SCHIZ0TR0N_TELEGRAM_BOT_TOKEN}
      
      # AI Provider for Schiz0tr0n
      - SCHIZ0TR0N_OPENROUTER_API_KEY=${SCHIZ0TR0N_OPENROUTER_API_KEY}
      
      # ===== OPTIONAL SHARED SERVICES =====
      # ElevenLabs Voice (optional)
      - ELEVENLABS_XI_API_KEY=${ELEVENLABS_XI_API_KEY}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - ELEVENLABS_VOICE_STABILITY=${ELEVENLABS_VOICE_STABILITY:-0.5}
      - ELEVENLABS_VOICE_SIMILARITY_BOOST=${ELEVENLABS_VOICE_SIMILARITY_BOOST:-0.9}
      
      # Database (optional)
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_URL=${POSTGRES_URL}
      
      # Node environment
      - NODE_ENV=production
      
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      
    # Resource limits (adjust based on your server)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

# Optional: PostgreSQL for data persistence
  postgres:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=eliza
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    profiles:
      - with-db

volumes:
  postgres-data: