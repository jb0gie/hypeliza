version: '3.8'

services:
  hypeliza:
    # GitHub Container Registry image
    image: '${DOCKER_IMAGE:-ghcr.io/jb0gie/hypeliza:latest}'
    container_name: hypeliza-multi-agent
    restart: unless-stopped
    ports:
      - "${SCHWEPE_PORT:-3000}:3000"  # schwepe agent
      - "${SCHIZ0TR0N_PORT:-3001}:3001"  # schiz0tr0n agent
    environment:
      # Multi-Agent Configuration
      - RUN_SCHWEPE=${RUN_SCHWEPE:-true}
      - RUN_SCHIZ0TR0N=${RUN_SCHIZ0TR0N:-false}
      - SCHWEPE_PORT=${SCHWEPE_PORT:-3000}
      - SCHIZ0TR0N_PORT=${SCHIZ0TR0N_PORT:-3001}
      
      # Core configuration
      - NODE_ENV=production
      
      # ============================================
      # SCHWEPE AGENT CONFIGURATION
      # ============================================
      
      # Schwepe AI Providers (at least one required)
      - SCHWEPE_OPENROUTER_API_KEY=${SCHWEPE_OPENROUTER_API_KEY:-}
      - SCHWEPE_GROQ_API_KEY=${SCHWEPE_GROQ_API_KEY:-}
      - SCHWEPE_OPENAI_API_KEY=${SCHWEPE_OPENAI_API_KEY:-}
      - SCHWEPE_ANTHROPIC_API_KEY=${SCHWEPE_ANTHROPIC_API_KEY:-}
      
      # Hyperfy Configuration (for schwepe)
      # For local: ws://localhost:3011/ws
      # For remote: wss://hyperfy.io/yourworld/ws
      - WS_URL=${WS_URL:-ws://localhost:3011/ws}
      
      # ============================================
      # SCHIZ0TR0N AGENT CONFIGURATION
      # ============================================
      
      # Schiz0tr0n Telegram Configuration
      - SCHIZ0TR0N_TELEGRAM_BOT_TOKEN=${SCHIZ0TR0N_TELEGRAM_BOT_TOKEN:-}
      
      # Schiz0tr0n AI Provider
      - SCHIZ0TR0N_OPENROUTER_API_KEY=${SCHIZ0TR0N_OPENROUTER_API_KEY:-}
      
      # ============================================
      # SHARED/OPTIONAL CONFIGURATION
      # ============================================
      
      # Discord configuration (optional)
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_APPLICATION_ID=${DISCORD_APPLICATION_ID:-}
      - DISCORD_API_TOKEN=${DISCORD_API_TOKEN:-}
      
      # Twitter configuration (optional)
      - TWITTER_USERNAME=${TWITTER_USERNAME:-}
      - TWITTER_PASSWORD=${TWITTER_PASSWORD:-}
      - TWITTER_EMAIL=${TWITTER_EMAIL:-}
      
      # ElevenLabs Voice Configuration (shared)
      - ELEVENLABS_XI_API_KEY=${ELEVENLABS_XI_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
      
      # Livekit configuration (optional)
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      
      # Database configuration (shared)
      - DATABASE_URL=${DATABASE_URL:-}
      
      # Puppeteer configuration for Hyperfy
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      
    volumes:
      # Persist data if needed
      - hypeliza-data:/app/data
      - hypeliza-logs:/app/logs
      
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health || http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Named volumes for persistence
volumes:
  hypeliza-data:
  hypeliza-logs: